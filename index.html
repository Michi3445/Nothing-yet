<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VHS·VISION</title>
<meta name="description" content="Projekte: Browser-Spiele, Tools und Mods im VHS-Look.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07040c;
    --wall-a: #1a0f24;
    --wall-b: #120a1a;
    --tv: #4a4458;
    --tv-hi: #6b6480;
    --tv-lo: #2c2838;
    --screen: #050608;
    --green: #39ff6a;
    --pink: #ff2e88;
    --cyan: #2ef2ff;
    --text: #e8ddff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'VT323', ui-monospace, monospace;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  body.scene { justify-content: flex-start; padding: 3vh 16px 2vh; }
  body.scene-in { overflow-y: auto; }

  /* Raum: Vorhang-Streifen + Vignette */
  .room {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(0,0,0,.85) 80%),
      repeating-linear-gradient(90deg, var(--wall-a) 0 38px, var(--wall-b) 38px 52px);
  }

  /* Fernseher */
  .tv {
    position: relative;
    --w: min(92vw, 150vh, 1100px);
    width: var(--w);
    height: calc(var(--w) * .7875);
    flex: none;
    transition: transform 1.2s cubic-bezier(.7,0,.2,1);
    z-index: 2;
    background: linear-gradient(180deg, var(--tv-hi), var(--tv) 12%, var(--tv) 80%, var(--tv-lo));
    border-radius: 6% / 8%;
    padding: calc(var(--w) * .055) calc(var(--w) * .07) calc(var(--w) * .15);
    box-shadow:
      inset 0 4px 0 rgba(255,255,255,.12),
      inset 0 -10px 0 rgba(0,0,0,.35),
      0 30px 80px rgba(0,0,0,.8);
  }
  .bezel {
    position: relative;
    width: 100%; height: 100%;
    background: #121018;
    border-radius: 7% / 9%;
    padding: 3.5%;
    box-shadow: inset 0 0 0 4px #0a0910, inset 0 8px 20px rgba(0,0,0,.9);
  }
  .screen {
    position: relative;
    width: 100%; height: 100%;
    background: var(--screen);
    border-radius: 6% / 8%;
    overflow: hidden;
    container-type: inline-size;
  }
  .screen canvas.noise {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; transition: opacity .3s;
    image-rendering: pixelated;
  }
  .screen.on canvas.noise { opacity: .16; }
  .screen.static canvas.noise { opacity: .9; }

  /* Overlays: Scanlines, Wölbung, Spurlinie */
  .scanlines, .glass, .tracking {
    position: absolute; inset: 0; pointer-events: none;
  }
  .scanlines {
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 2px, transparent 2px 4px);
    z-index: 5;
  }
  .glass {
    background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.75) 100%),
                linear-gradient(160deg, rgba(255,255,255,.07), transparent 35%);
    z-index: 6;
  }
  .tracking {
    height: 9%;
    top: -10%;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,.08) 40%, rgba(255,255,255,.14) 50%, transparent);
    z-index: 4;
    display: none;
  }
  .screen.on .tracking { display: block; animation: track 7s linear infinite; }
  @keyframes track { 0% { top: -10%; } 60%, 100% { top: 110%; } }

  /* Einschalt-Animation */
  .content {
    position: absolute; inset: 0;
    z-index: 3;
    opacity: 0;
  }
  .screen.on .content { opacity: 1; animation: poweron .55s cubic-bezier(.2,.8,.2,1) both, flicker 4s infinite 1s; }
  @keyframes poweron {
    0%   { transform: scale(1, .004); filter: brightness(6); }
    45%  { transform: scale(1, .004); filter: brightness(6); }
    70%  { transform: scale(1, 1.05); filter: brightness(2); }
    100% { transform: scale(1, 1);   filter: brightness(1); }
  }
  @keyframes flicker {
    0%, 97%, 100% { opacity: 1; }
    98% { opacity: .82; }
    99% { opacity: .95; }
  }
  .screen.off-dot::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 6px; height: 6px; margin: -3px;
    border-radius: 50%; background: #fff;
    box-shadow: 0 0 18px 6px rgba(255,255,255,.6);
    animation: dot 1.4s ease-out forwards;
    z-index: 7;
  }
  @keyframes dot { to { transform: scale(0); opacity: 0; } }

  /* OSD-Elemente */
  .osd {
    position: absolute;
    font-size: 6cqw;
    letter-spacing: .08em;
    color: var(--green);
    text-shadow: 3px 0 0 rgba(0,90,30,.9), 0 0 12px rgba(57,255,106,.6);
  }
  .osd.av { top: 6%; right: 8%; font-size: 9cqw; transition: opacity .4s; }
  .osd.av.hide { opacity: 0; }
  .osd.mode { top: 7%; left: 8%; font-size: 4.2cqw; color: var(--text); text-shadow: 2px 0 var(--pink), -2px 0 var(--cyan); opacity: 0; }
  .osd.time { bottom: 7%; left: 8%; font-size: 4.2cqw; color: var(--text); text-shadow: 2px 0 var(--pink), -2px 0 var(--cyan); opacity: 0; }
  .osd.date { bottom: 7%; right: 8%; font-size: 4.2cqw; color: var(--text); text-shadow: 2px 0 var(--pink), -2px 0 var(--cyan); opacity: 0; }
  .screen.ready .osd.mode, .screen.ready .osd.time, .screen.ready .osd.date { opacity: .9; }

  /* Titel */
  .title {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3cqw;
    opacity: 0; transition: opacity .5s;
  }
  .screen.ready .title { opacity: 1; }
  .loader {
    display: flex; flex-direction: column; align-items: center; gap: 2.4cqw;
    font-size: 5.4cqw; letter-spacing: .12em;
    color: var(--text);
    text-shadow: .3cqw 0 var(--pink), -.3cqw 0 var(--cyan);
  }
  .spin { font-size: 11cqw; line-height: 1; min-width: 1ch; white-space: pre; text-align: center; color: #fff; }
  .lbar { font-size: 4.2cqw; letter-spacing: .05em; color: var(--cyan); text-shadow: 0 0 10px rgba(46,242,255,.5); white-space: pre; }
  .cur { animation: blink .7s steps(1) infinite; }
  .press { display: none; }
  .screen.loaded .press { display: block; }
  .screen.loaded .spin { color: var(--green); text-shadow: 0 0 12px rgba(57,255,106,.6); }
  .press {
    margin-top: 4cqw;
    font-size: 5.2cqw;
    letter-spacing: .12em;
    color: var(--text);
    animation: blink 1.1s steps(1) infinite;
  }
  .press b { color: var(--pink); font-weight: normal; }
  @keyframes blink { 50% { opacity: 0; } }
  .press .t { display: none; }
  @media (hover: none) { .press .k { display: none; } .press .t { display: inline; } }

  /* Kassette-einlegen-Screen (Platzhalter bis Schritt 2) */
  .insert {
    position: absolute; inset: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2cqw;
    font-size: 6cqw; letter-spacing: .1em;
    text-shadow: .3cqw 0 var(--pink), -.3cqw 0 var(--cyan);
  }
  .insert small { font-size: 3.6cqw; color: var(--cyan); letter-spacing: .2em; text-shadow: none; opacity: .8; }
  .screen.inserting .title { display: none; }
  .screen.inserting .insert { display: flex; }
  .insert .bar { width: 50cqw; height: 2.4cqw; border: .4cqw solid var(--text); padding: .4cqw; }
  .insert .bar i { display: block; height: 100%; width: 0; background: var(--pink); animation: load 2.4s steps(12) forwards; }
  @keyframes load { to { width: 100%; } }

  /* Glitch-Burst bei Tastendruck */
  .screen.glitch .content { animation: glitch .35s steps(2) 1; }
  @keyframes glitch {
    0%   { transform: translate(0); filter: hue-rotate(0); }
    25%  { transform: translate(-2%, 1%) skewX(-6deg); filter: hue-rotate(90deg) saturate(3); }
    50%  { transform: translate(3%, -1%); }
    75%  { transform: translate(-1%, 0) skewX(4deg); filter: hue-rotate(-60deg); }
    100% { transform: translate(0); filter: none; }
  }

  /* Gerät unten: Markenschild, Rekorder-Schlitz, Knöpfe */
  .brand {
    position: absolute; left: 50%; bottom: 8.6%;
    transform: translateX(-50%);
    font-size: clamp(14px, 2.6vw, 30px);
    letter-spacing: .35em;
    color: #b9b2cc;
    text-shadow: 0 1px 0 #1e1b28, 0 -1px 0 #7f7894;
  }
  .vcr {
    position: absolute; left: 22%; right: 22%; bottom: 3%;
    height: 4.4%;
    background: #1d1a26;
    border-radius: 4px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.08);
  }
  .vcr::after {
    content: 'S-VHS'; position: absolute; right: 2%; top: 50%; transform: translateY(-50%);
    font-size: clamp(8px, 1.1vw, 13px); letter-spacing: .2em; color: #6e6782;
  }
  .power {
    position: absolute; right: 7%; bottom: 3%;
    width: clamp(18px, 3vw, 34px); aspect-ratio: 1;
    border-radius: 50%;
    border: none; cursor: pointer;
    background: radial-gradient(circle at 40% 35%, #3a3548, #16141d);
    box-shadow: 0 2px 0 #0d0c12, inset 0 1px 0 rgba(255,255,255,.15);
  }
  .led {
    position: absolute; right: 12.5%; bottom: 4.6%;
    width: clamp(5px, .7vw, 8px); aspect-ratio: 1; border-radius: 50%;
    background: #3a0b12;
  }
  .led.on { background: #ff3048; box-shadow: 0 0 8px 2px rgba(255,48,72,.7); }

  .hint {
    position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
    font-size: 18px; color: #6e6782; letter-spacing: .15em;
  }
  body.scene .hint { position: relative; bottom: auto; margin-top: 2vh; z-index: 1; }

  /* ===== Regal ===== */
  body.scene .tv { --w: min(92vw, 66vh, 760px); }
  .shelf {
    display: none;
    position: relative; z-index: 1;
    width: min(96vw, 1180px);
    margin-top: -1.2vh;
    opacity: 0;
    transition: opacity .6s .5s;
  }
  body.scene .shelf { display: block; }
  body.scene .tv.instant { transition: none; }
  body.scene-in .shelf { opacity: 1; }
  .plank {
    height: clamp(14px, 2.4vh, 26px);
    background: linear-gradient(180deg, #8a5a3c, #6b4129 45%, #4a2a19);
    border-radius: 4px;
    box-shadow: 0 6px 14px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,220,180,.18);
  }
  .cabinet {
    margin: 0 2.5%;
    padding: 2.2vh 3% 2.6vh;
    background:
      linear-gradient(90deg, #3a2215 0 14px, transparent 14px calc(100% - 14px), #3a2215 calc(100% - 14px)),
      linear-gradient(180deg, #1a0e09, #241510);
    box-shadow: inset 0 14px 22px rgba(0,0,0,.75);
  }
  .stacks {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.4vh 4%;
    align-items: end;
  }
  .stack { display: flex; flex-direction: column; gap: 4px; }
  .tape {
    all: unset;
    box-sizing: border-box;
    display: flex; align-items: center; gap: 10px;
    height: clamp(38px, 5.6vh, 56px);
    padding: 0 12px 0 8px;
    background: linear-gradient(180deg, #3a3446, #26212f 55%, #1a1621);
    border-radius: 4px;
    box-shadow: 0 3px 0 #0d0b11, inset 0 1px 0 rgba(255,255,255,.12);
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    font-family: 'VT323', monospace;
  }
  .stack .tape:nth-child(2) { transform: translateX(10px); }
  .stack .tape:nth-child(3) { transform: translateX(-6px); }
  .stack:nth-child(2) .tape:nth-child(1) { transform: translateX(6px); }
  .stack:nth-child(3) .tape:nth-child(2) { transform: translateX(-10px); }
  .tape .num {
    flex: none;
    width: clamp(26px, 3.6vh, 38px); aspect-ratio: 1;
    display: grid; place-items: center;
    background: #efe6d2;
    color: #d0263f;
    font-size: clamp(18px, 2.8vh, 28px);
    transform: rotate(-5deg);
    box-shadow: 1px 1px 0 rgba(0,0,0,.4);
  }
  .tape .label {
    flex: 1;
    height: 66%;
    display: flex; align-items: center; justify-content: center;
    background: #b8abcf;
    color: #241b33;
    font-size: clamp(18px, 3vh, 30px);
    letter-spacing: .08em;
    border-radius: 2px;
    position: relative;
    white-space: nowrap; overflow: hidden;
  }
  .tape .label::before {
    content: ''; position: absolute; left: 6px; top: 20%; bottom: 20%; width: 8px;
    border-left: 2px solid rgba(36,27,51,.5); border-right: 2px solid rgba(36,27,51,.5);
  }
  .tape.soon .label { background: #8f8a9c; }
  .tape.sel { transform: translateX(-14px) !important; box-shadow: 0 3px 0 #0d0b11, 0 0 0 2px var(--pink), 0 0 22px rgba(255,46,136,.45); }
  .tape.sel .label { background: #fff; }
  .tape:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  /* Vorschau auf dem Bildschirm */
  .preview {
    position: absolute; inset: 14% 10% 16%;
    display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    gap: 1.6cqw;
  }
  .screen.shelf-mode .title, .screen.shelf-mode .insert { display: none; }
  .screen.shelf-mode .preview { display: flex; }
  .screen.shelf-mode.inserting .preview { display: none; }
  .screen.shelf-mode.inserting .insert { display: flex; }
  .p-num { font-size: 4.4cqw; color: var(--green); letter-spacing: .2em; text-shadow: 0 0 10px rgba(57,255,106,.5); }
  .p-name {
    font-size: 11cqw; line-height: .95; letter-spacing: .06em; color: #fff;
    text-shadow: .4cqw 0 var(--pink), -.4cqw 0 var(--cyan), 0 0 2cqw rgba(255,46,136,.4);
  }
  .p-tag { font-size: 4.2cqw; color: var(--cyan); letter-spacing: .25em; }
  .p-desc { font-size: 4.4cqw; line-height: 1.15; color: var(--text); max-width: 90%; opacity: .9; }
  .p-play { margin-top: 1.5cqw; font-size: 4.6cqw; color: var(--pink); letter-spacing: .12em; animation: blink 1.1s steps(1) infinite; }
  .screen.flash canvas.noise { opacity: .7; }

  @media (max-width: 640px) {
    .stacks { grid-template-columns: 1fr; gap: 4px; }
    .stack .tape { transform: none !important; }
    .tape.sel { transform: translateX(-8px) !important; }
    body.scene .tv { --w: min(92vw, 520px); }
    .p-desc { font-size: 5cqw; }
  }

  @media (prefers-reduced-motion: reduce) {
    .press, .cur, .screen.on .content, .screen.on .tracking { animation: none !important; }
  }
</style>
</head>
<body class="scene">
  <div class="room"></div>

  <main class="tv" aria-label="Fernseher">
    <div class="bezel">
      <div class="screen" id="screen">
        <canvas class="noise" id="noise" width="160" height="120"></canvas>
        <div class="content">
          <div class="osd av" id="av">AV 1</div>
          <div class="osd mode">PLAY ▶</div>
          <div class="osd time" id="time">SP 0:00:00</div>
          <div class="osd date" id="date"></div>

          <section class="title">
<div class="loader" id="loader">
              <div class="spin" id="spin">/</div>
              <div class="ltxt"><span id="ltxt">LADE</span><span class="cur">_</span></div>
              <div class="lbar" id="lbar">[--------------------]</div>
            </div>
            <div class="press">▶ <b class="k">TASTE</b><b class="t">TIPPEN</b> <span class="k">DRÜCKEN</span></div>
          </section>

          <section class="insert" aria-live="polite">
            <div id="insertTxt">KASSETTE EINLEGEN…</div>
            <div class="bar"><i></i></div>
            <small id="insertSub"></small>
          </section>

          <section class="preview" aria-live="polite">
            <div class="p-num" id="pNum">TAPE 01</div>
            <div class="p-name" id="pName"></div>
            <div class="p-tag" id="pTag"></div>
            <div class="p-desc" id="pDesc"></div>
            <div class="p-play" id="pPlay"></div>
          </section>
        </div>
        <div class="tracking"></div>
        <div class="scanlines"></div>
        <div class="glass"></div>
      </div>
    </div>
    <div class="brand">VHS·VISION</div>
    <div class="vcr"></div>
    <div class="led" id="led"></div>
    <button class="power" id="power" aria-label="Ein/Aus"></button>
  </main>

  <section class="shelf" aria-label="Kassettenregal">
    <div class="plank"></div>
    <div class="cabinet">
      <div class="stacks" id="stacks"></div>
    </div>
    <div class="plank"></div>
  </section>

  <div class="hint" id="hint"></div>

<script>
(() => {
  const screen = document.getElementById('screen');
  const canvas = document.getElementById('noise');
  const ctx = canvas.getContext('2d');
  const led = document.getElementById('led');
  const av = document.getElementById('av');
  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');
  const hint = document.getElementById('hint');
  const tv = document.querySelector('.tv');
  const bezel = document.querySelector('.bezel');

  // Intro: Fernseher so nah, dass der Bildschirm das ganze Fenster füllt
  let zoomed = false;
  function zoomIn() {
    tv.classList.add('instant');
    tv.style.transform = 'none';
    const tr = tv.getBoundingClientRect(), br = bezel.getBoundingClientRect();
    const cx = br.left + br.width / 2, cy = br.top + br.height / 2;
    const sc = Math.min(innerHeight * 1.06 / br.height, innerWidth * 1.0 / br.width);
    tv.style.transformOrigin = `${cx - tr.left}px ${cy - tr.top}px`;
    tv.style.transform = `translate(${innerWidth / 2 - cx}px, ${innerHeight / 2 - cy}px) scale(${sc})`;
    tv.offsetWidth;
    tv.classList.remove('instant');
    zoomed = true;
  }
  function zoomOut(instant) {
    if (instant) tv.classList.add('instant');
    tv.style.transform = '';
    zoomed = false;
    if (instant) { tv.offsetWidth; tv.classList.remove('instant'); }
  }
  addEventListener('resize', () => { if (zoomed) zoomIn(); });

  // Bildrauschen
  const img = ctx.createImageData(canvas.width, canvas.height);
  function drawNoise() {
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = Math.random() * 255 | 0;
      d[i] = v; d[i + 1] = v; d[i + 2] = v + 10; d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(drawNoise);
  }
  requestAnimationFrame(drawNoise);

  // Datum im VHS-Stil
  const m = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const now = new Date();
  dateEl.textContent = `${m[now.getMonth()]}. ${String(now.getDate()).padStart(2,'0')} ${now.getFullYear()}`;

  // Bandzähler
  let t0 = 0, timer = null;
  function tick() {
    const s = Math.floor((performance.now() - t0) / 1000);
    timeEl.textContent = `SP ${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
  }

  let state = 'off';
  const timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  function powerOn() {
    if (state !== 'off') return;
    state = 'booting';
    led.classList.add('on');
    hint.textContent = '';
    screen.classList.add('on', 'static');
    av.classList.remove('hide');
    later(() => screen.classList.remove('static'), 900);
    later(() => av.classList.add('hide'), 2200);
    let seen = false;
    try { seen = sessionStorage.getItem('vhs-seen') === '1'; } catch (e) {}
    later(() => {
      screen.classList.add('ready');
      t0 = performance.now(); timer = setInterval(tick, 250);
      if (seen) enterShelf(true); else runLoader();
    }, seen ? 700 : 1500);
  }

  // Minimaler ASCII-Lader
  const spinEl = document.getElementById('spin');
  const barEl = document.getElementById('lbar');
  const frames = ['/', '-', '\\', '|'];
  let spinTimer = null;
  function runLoader() {
    state = 'loading';
    let f = 0, p = 0;
    const W = 20;
    spinTimer = setInterval(() => {
      spinEl.textContent = frames[f++ % 4];
      p = Math.min(100, p + 1 + (Math.random() * 5 | 0));
      const n = Math.round(p / 100 * W);
      barEl.textContent = '[' + '#'.repeat(n) + '-'.repeat(W - n) + '] ' + String(p).padStart(3, ' ') + '%';
      if (p >= 100) {
        clearInterval(spinTimer);
        spinEl.textContent = '(/ _ )';
        document.getElementById('ltxt').textContent = 'BEREIT';
        screen.classList.add('loaded');
        state = 'title';
      }
    }, 90);
  }

  function powerOff() {
    clearInterval(spinTimer);
    timers.forEach(clearTimeout); timers.length = 0;
    clearInterval(timer);
    screen.className = 'screen off-dot';
    sel = -1;
    document.getElementById('ltxt').textContent = 'LADE'; spinEl.textContent = '/'; barEl.textContent = '[--------------------]';
    led.classList.remove('on');
    state = 'off';
    hint.textContent = 'POWER-KNOPF ODER TASTE ZUM EINSCHALTEN';
    setTimeout(() => screen.classList.remove('off-dot'), 1500);
  }

  // ===== Kassetten =====
  const TAPES = [
    { name: 'KLOTZWELT',    tag: 'VOXEL · SURVIVAL',  url: 'games/klotzwelt.html',     desc: 'Eigene Klötzchenwelt mit Überleben- und Kreativmodus, Crafting, Monstern und Wetter.' },
    { name: 'ASCII ARCADE', tag: '5 RETRO-SPIELE',    url: 'games/ascii-arcade.html',  desc: 'Doom, Pong, Tetris, Pacman und Nachtschicht, alles aus Textzeichen.' },
    { name: 'PULSE GRID',   tag: 'RHYTHMUS',          url: 'games/pulse-grid.html',    desc: 'Triff die Noten im 3×3-Raster. Eigene Songs laden, Maps importieren, Mods an.' },
    { name: 'SOLITAIRE',    tag: 'KARTEN',            url: 'games/solitaire.html',     desc: 'Klassisches Klondike im Retro-Fenster. Doppelklick legt Karten ab.' },
    { name: 'RETRO 98',     tag: 'DESKTOP',           url: 'games/retro98.html',       desc: 'Ein ganzer Retro-Desktop mit Startmenü, Paint, Minesweeper und mehr.' },
    { name: 'LERNWERK',     tag: 'SCHULE',            url: 'games/lernwerk.html',      desc: 'Aufgaben, Noten-Schnitt, Stundenplan, Karteikarten, Formeln und 3D-Labor.' },
    { name: 'WICHTEL',      tag: 'PARTY',             url: 'games/wichtel.html',       desc: 'Sieht aus wie ein Weihnachts-Countdown. Dahinter steckt eine ganze Spielhalle.' },
    { name: 'ABGABE-TRAINER', tag: 'KI · EIGENER API-KEY', url: 'games/abgabe-trainer.html', desc: 'Übt das Abgabegespräch. Eine KI spielt die Lehrkraft.' },
    { name: 'NAUTO-MOD',    tag: 'MINECRAFT-MOD',     url: null,                       desc: 'Naruto-Mod für Minecraft 1.21.1. Infoseite folgt.' },
  ];
  const stacksEl = document.getElementById('stacks');
  const tapeEls = [];
  for (let c = 0; c < 3; c++) {
    const st = document.createElement('div'); st.className = 'stack';
    for (let r = 0; r < 3; r++) {
      const i = c * 3 + r, t = TAPES[i]; if (!t) continue;
      const b = document.createElement('button');
      b.className = 'tape' + (t.url ? '' : ' soon');
      b.innerHTML = `<span class="num">${i + 1}</span><span class="label">${t.name}</span>`;
      b.setAttribute('aria-label', `${i + 1}: ${t.name}`);
      b.addEventListener('mouseenter', () => { if (state === 'shelf' && matchMedia('(hover: hover)').matches) select(i); });
      b.addEventListener('focus', () => { if (state === 'shelf') select(i); });
      b.addEventListener('click', e => {
        e.stopPropagation();
        if (state !== 'shelf') return;
        if (sel === i) play(); else select(i);
      });
      st.appendChild(b); tapeEls[i] = b;
    }
    stacksEl.appendChild(st);
  }

  const touch = matchMedia('(hover: none)').matches;
  let sel = -1;
  function select(i) {
    if (i === sel) return;
    sel = i;
    tapeEls.forEach((el, k) => el.classList.toggle('sel', k === i));
    const t = TAPES[i];
    document.getElementById('pNum').textContent = `TAPE ${String(i + 1).padStart(2, '0')}`;
    document.getElementById('pName').textContent = t.name;
    document.getElementById('pTag').textContent = t.tag;
    document.getElementById('pDesc').textContent = t.desc;
    document.getElementById('pPlay').textContent = t.url ? (touch ? '▶ NOCHMAL TIPPEN' : '▶ ENTER / KLICK') : '■ BALD VERFÜGBAR';
    screen.classList.add('flash');
    clearTimeout(select.f); select.f = setTimeout(() => screen.classList.remove('flash'), 140);
  }

  function play() {
    const t = TAPES[sel];
    if (!t.url) {
      screen.classList.add('glitch');
      setTimeout(() => screen.classList.remove('glitch'), 350);
      return;
    }
    state = 'playing';
    document.getElementById('insertTxt').textContent = 'KASSETTE WIRD EINGELEGT…';
    document.getElementById('insertSub').textContent = t.name;
    screen.classList.add('glitch', 'inserting');
    setTimeout(() => screen.classList.remove('glitch'), 350);
    setTimeout(() => { location.href = t.url; }, 1300);
  }

  function enterShelf(fast) {
    state = 'shelf';
    try { sessionStorage.setItem('vhs-seen', '1'); } catch (e) {}
    screen.classList.add('glitch', 'static');
    setTimeout(() => {
      screen.classList.remove('glitch', 'static', 'inserting');
      screen.classList.add('shelf-mode');
      zoomOut(fast);
      setTimeout(() => document.body.classList.add('scene-in'), fast ? 0 : 700);
      hint.textContent = touch ? 'KASSETTE ANTIPPEN' : '↑ ↓ ← → WÄHLEN · ENTER ABSPIELEN';
      select(sel < 0 ? 0 : sel);
    }, fast ? 0 : 350);
  }

  function pressStart() {
    if (state === 'title') enterShelf(false);
  }

  function move(dx, dy) {
    let c = Math.floor(sel / 3), r = sel % 3;
    c = (c + dx + 3) % 3; r = (r + dy + 3) % 3;
    const i = c * 3 + r;
    if (TAPES[i]) { select(i); tapeEls[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }

  document.getElementById('power').addEventListener('click', e => {
    e.stopPropagation();
    state === 'off' ? powerOn() : powerOff();
  });
  document.addEventListener('keydown', e => {
    if (state === 'off') return powerOn();
    if (state === 'title') return pressStart();
    if (state !== 'shelf') return;
    const k = e.key;
    if (k === 'ArrowUp') { e.preventDefault(); move(0, -1); }
    else if (k === 'ArrowDown') { e.preventDefault(); move(0, 1); }
    else if (k === 'ArrowLeft') { e.preventDefault(); move(-1, 0); }
    else if (k === 'ArrowRight') { e.preventDefault(); move(1, 0); }
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); play(); }
  });
  document.addEventListener('click', () => {
    if (state === 'off') powerOn(); else pressStart();
  });

  // Zurück aus einem Spiel (Browser-Cache): Regal wiederherstellen
  window.addEventListener('pageshow', e => {
    if (e.persisted && state === 'playing') {
      screen.classList.remove('inserting');
      state = 'shelf';
    }
  });

  let seen0 = false;
  try { seen0 = sessionStorage.getItem('vhs-seen') === '1'; } catch (e) {}
  if (!seen0) zoomIn();

  // Automatisch einschalten
  setTimeout(powerOn, 600);
})();
</script>
</body>
</html>
